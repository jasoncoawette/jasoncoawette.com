<!doctype html>
<html lang="en">
	<head>
		<title>Jason Coawette - Software Engineer</title>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Inter font – cached by the browser via immutable headers from Google -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- THEME INIT -->
		<script>
			(() => {
				const stored = localStorage.getItem('theme');
				const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
				const resolved =
					stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
				document.documentElement.classList.toggle('dark', resolved === 'dark');
			})();
		</script>

		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="flex min-h-screen w-full min-w-xs flex-col items-center justify-start antialiased select-none"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
