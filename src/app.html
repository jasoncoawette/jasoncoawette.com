<!doctype html>
<html lang="en" class="text-primary-fg">
	<head>
		<title>Jason Coawette - Design Engineer</title>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Inter font – cached by the browser via immutable headers from Google -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<meta name="theme-color" content="#ebebeb" />

		<!-- THEME FLASH GUARD – must be inline so it runs synchronously before first paint -->
		<script>
			(function () {
				var stored = localStorage.getItem('theme');
				var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				var theme =
					stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
				var isDark = theme === 'dark';
				document.documentElement.classList.add(theme);
				document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
				document.documentElement.style.backgroundColor = isDark ? 'oklch(20.5% 0 0)' : 'oklch(92.2% 0 0)';
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', isDark ? '#353535' : '#ebebeb');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="flex min-h-screen w-full min-w-xs flex-col items-center justify-start bg-primary-bg antialiased select-none"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
