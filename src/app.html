<!doctype html>
<html lang="en" class="is-covered">
	<head>
		<title>Jason Coawette - Forward Deployed Engineer</title>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Inter font – cached by the browser via immutable headers from Google -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- THEME INIT
		     Dark is the default and needs no marker; only an explicit switch to
		     light writes an attribute. Runs blocking in <head> so the first paint
		     is already the right colour — the gate paints the ground too, and a
		     light-to-dark snap would be the first thing anyone sees. -->
		<script>
			(() => {
				try {
					if (localStorage.getItem('jc-theme') === 'light') {
						document.documentElement.dataset.theme = 'light';
						document.documentElement.style.colorScheme = 'light';
					} else {
						document.documentElement.style.colorScheme = 'dark';
					}
				} catch (e) {
					document.documentElement.style.colorScheme = 'dark';
				}
			})();
		</script>

		<!-- Without JS the gate can never be dismissed, so drop it and release
		     the scroll lock that is set on <html> above. -->
		<noscript>
			<style>
				html.is-covered,
				html.is-covered body {
					overflow: auto !important;
				}
				.gate {
					display: none !important;
				}
			</style>
		</noscript>

		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="flex w-full min-w-xs flex-col items-center justify-start antialiased select-none"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
